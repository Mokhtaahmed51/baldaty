<body>

<script>
/* ===== إعدادات Firebase ===== */
const CFG = {
  apiKey: "AIzaSyDh5pTDXDQ1kLOzyCkufiWcPSEo8Q6J7SY",
  authDomain: "studio-61196567-8edf5.firebaseapp.com",
  projectId: "studio-61196567-8edf5",
  storageBucket: "studio-61196567-8edf5.firebasestorage.app",
  messagingSenderId: "484094142486",
  appId: "1:484094142486:web:baldaty"
};
const LIVE = !!CFG.apiKey && typeof firebase !== 'undefined';
let fs, au, st, fcmMsg;
if (LIVE) {
  firebase.initializeApp(CFG);
  fs = firebase.firestore();
  au = firebase.auth();
  st = firebase.storage();
  if (typeof firebase.messaging === 'function' && 'Notification' in window) {
    try { fcmMsg = firebase.messaging(); } catch (e) { console.warn('FCM Init Warning:', e); }
  }
}

/* ===== تنظيف وضغط البيانات وحذف الحقول الفارغة لتقليص حجم مستندات Firestore ===== */
function cleanDoc(obj) {
  if (!obj || typeof obj !== 'object') return obj;
  if (Array.isArray(obj)) return obj.map(cleanDoc).filter(x => x !== undefined && x !== null);
  const out = {};
  for (const [k, v] of Object.entries(obj)) {
    if (v === undefined || v === null) continue;
    if (typeof v === 'string') {
      const trimmed = v.trim();
      if (trimmed === '' && ['note', 'notes', 'extra', 'desc2', 'bio', 'details', 'comment'].includes(k)) continue;
      out[k] = trimmed;
    } else if (typeof v === 'object' && !(v instanceof Date) && !(v.constructor && v.constructor.name === 'FieldValue')) {
      out[k] = cleanDoc(v);
    } else {
      out[k] = v;
    }
  }
  return out;
}

/* ===== طبقة البيانات ===== */
const COLS = ['users','services','reviews','issues','heroes','charity','notes','reports','market','events','jobs','phones','cfg','payments','fines'];
const D = {}; COLS.forEach(c => D[c] = []);
const MEM = {};
const LS = {
  get: k => { try { const v = localStorage.getItem(k); if (v !== null) return v; } catch (e) {} return MEM[k] ?? null; },
  set: (k, v) => { MEM[k] = v; try { localStorage.setItem(k, v); } catch (e) {} },
  del: k => { delete MEM[k]; try { localStorage.removeItem(k); } catch (e) {} }
};
const L = {
  g: k => JSON.parse(LS.get('b_' + k) || '[]'),
  s: (k, v) => {
    // تقييد حجم الذاكرة المحلية وتوفير المساحة
    const capped = Array.isArray(v) ? v.slice(0, 50) : v;
    LS.set('b_' + k, JSON.stringify(capped));
  }
};
const fire = c => { D[c] = L.g(c); R(); };

/* تحرير وحذف الملفات والصور فوراً من Firebase Storage لتوفير المساحة */
async function deleteStorageFile(urlOrPath) {
  if (!LIVE || !st || !urlOrPath || typeof urlOrPath !== 'string') return;
  try {
    if (urlOrPath.startsWith('img/') || urlOrPath.startsWith('private/')) {
      await st.ref(urlOrPath).delete();
    } else if (urlOrPath.includes('firebasestorage.googleapis.com')) {
      await st.refFromURL(urlOrPath).delete();
    }
  } catch (err) {
    console.debug('Storage cleanup notice:', err?.code || err?.message);
  }
}

let activeUnsubs = {};
function unsubsAll() {
  Object.values(activeUnsubs).forEach(un => { if (typeof un === 'function') un(); });
  activeUnsubs = {};
}

const DB = {
  sub(c, govFilter) {
    if (LIVE) {
      if (activeUnsubs[c]) { activeUnsubs[c](); delete activeUnsubs[c]; }
      
      const isAdmin = me()?.role === 'admin';
      const inAdmin = isAdmin && V === 'admin';

      // مجموعة البلاغات متاحة فقط داخل لوحة الأدمن
      if (c === 'reports') {
        if (!inAdmin) {
          D[c] = [];
          return;
        }
      }

      let ref = fs.collection(c);
      if (GOVC.includes(c) && govFilter && govFilter !== 'all') {
        ref = ref.where('gov', 'in', [govFilter, 'all']).limit(60);
      } else if (c === 'notes' && govFilter && govFilter !== 'all') {
        ref = ref.where('gov', 'in', [govFilter, 'all']).limit(20);
      } else if (c === 'users') {
        ref = ref.limit(100);
      } else if (c === 'payments') {
        if (!inAdmin) {
          if (!uid) { D[c] = []; return; }
          ref = ref.where('by', '==', uid).limit(50);
        } else {
          ref = ref.limit(60);
        }
      } else if (c === 'fines') {
        if (!inAdmin) {
          if (!uid) { D[c] = []; return; }
          ref = ref.where('uid', '==', uid).limit(50);
        } else {
          ref = ref.limit(60);
        }
      } else {
        ref = ref.limit(60);
      }

      try {
        activeUnsubs[c] = ref.onSnapshot(s => {
          const fetched = s.docs.map(d => ({ ...d.data(), id: d.id }));
          if (c === 'users' && uid) {
            const currentU = D.users.find(x => x.id === uid);
            if (currentU && !fetched.some(x => x.id === uid)) {
              fetched.unshift(currentU);
            }
          }
          D[c] = fetched.sort((a,b) => (b.at||0) - (a.at||0));
          R();
          if (c === 'notes') ping();
        }, err => {
          console.warn('Subscription info for ' + c + ':', err.code, err.message);
          D[c] = L.g(c);
          R();
        });
      } catch (err) {
        console.warn('Failed to subscribe to ' + c + ':', err);
        D[c] = L.g(c);
        R();
      }
      return;
    }
    D[c] = L.g(c);
  },
  async set(c, o, id) {
    o.at = o.at || Date.now();
    if (GOVC.includes(c) && o.gov === undefined) o.gov = cg();
    if (window._ack && ['services','issues','heroes','market','events','jobs','charity','payments','reviews'].includes(c)) {
      o.ack = window._ack;
      o.fine = FINE;
      if (window._urg && ['issues','heroes','events'].includes(c)) {
        o.ok = true; o.urgent = true; o.rev = false;
      }
    }
    const cleanPayload = cleanDoc(o);
    if (LIVE) {
      cleanPayload.createdAt = firebase.firestore.FieldValue.serverTimestamp();
      try {
        if (id) {
          await fs.collection(c).doc(id).set(cleanPayload, { merge: true });
          return id;
        }
        return (await fs.collection(c).add(cleanPayload)).id;
      } catch (err) {
        console.warn('Firestore write notice, caching locally for ' + c, err);
      }
    }
    id = id || 'i' + Date.now() + Math.random().toString(36).slice(2, 6);
    L.s(c, [{ ...cleanPayload, id }, ...L.g(c).filter(x => x.id !== id)]);
    fire(c);
    return id;
  },
  async up(c, id, p) {
    const cleanPayload = cleanDoc(p);
    if (LIVE) {
      try {
        return await fs.collection(c).doc(id).update(cleanPayload);
      } catch (err) {
        if (err?.code === 'permission-denied' || String(err?.message||'').includes('insufficient permissions')) {
          console.warn('Firestore update permission denied, updating locally for ' + c);
        } else {
          throw err;
        }
      }
    }
    L.s(c, L.g(c).map(x => x.id === id ? { ...x, ...cleanPayload } : x));
    fire(c);
  },
  async del(c, id) {
    // 1. تحرير مساحة التخزين في Firebase Storage إذا احتوى المستند على صور
    const existingDoc = (D[c] || []).find(x => x.id === id);
    if (existingDoc) {
      ['photo', 'after', 'img', 'doc', 'receipt'].forEach(k => {
        if (existingDoc[k]) deleteStorageFile(existingDoc[k]);
      });
    }

    // 2. التحديث الفوري المباشر في الذاكرة المحلية والواجهة
    D[c] = (D[c] || []).filter(x => x.id !== id);
    L.s(c, L.g(c).filter(x => x.id !== id));
    fire(c);
    toast('تم الحذف وتحرير المساحة 🗑️');

    // 3. الحذف السحابي من Firestore في الخلفية
    if (LIVE) {
      try {
        await fs.collection(c).doc(id).delete();
      } catch (err) {
        console.warn('Firestore delete notice for ' + c, err);
      }
    }
  }

const privUrlCache = new Map();
async function resolvePrivUrl(path) {
  if (!path) return '';
  if (path.startsWith('data:') || path.startsWith('http')) return path;
  if (privUrlCache.has(path)) return privUrlCache.get(path);
  const localCached = LS.get('img_cache_' + path);
  if (localCached) {
    privUrlCache.set(path, localCached);
    return localCached;
  }
  if (LIVE && st) {
    try {
      const u = await st.ref(path).getDownloadURL();
      privUrlCache.set(path, u);
      try { LS.set('img_cache_' + path, u); } catch (_) {}
      return u;
    } catch (e) {
      console.warn('Image resolution failed:', e);
      return '';
    }
  }
  return path;
}

/* ===== محرك الضغط الفائق والتوفير الذكي لمساحة تخزين وكوتا Firebase ===== */
function checkWebPSupport() {
  try {
    const c = document.createElement("canvas");
    return c.toDataURL("image/webp").indexOf("data:image/webp") === 0;
  } catch (e) {
    return false;
  }
}
const supportsWebP = checkWebPSupport();

/**
 * ضغط الصور فائق الكفاءة:
 * يحول الصور إلى WebP (أو JPEG كبديل) مع تصغير الأبعاد والضغط التكراري
 * لتقليص حجم أي صورة من عدة ميجابايتات إلى ~10 - 22 كيلوبايت فقط (توفير أكثر من 98%)
 */
function compressImage(file, opts = {}) {
  return new Promise((res) => {
    if (!file) return res({ dataUrl: "", origSize: 0, newSize: 0, mime: "" });
    const isImageFile = (file.type && file.type.startsWith("image/")) || 
                        /\.(jpe?g|png|webp|gif|bmp|heic|svg)$/i.test(file.name || "") || 
                        file.size > 0;
    if (!isImageFile) return res({ dataUrl: "", origSize: 0, newSize: 0, mime: "" });
    const origSize = file.size || 0;
    const r = new FileReader();
    r.onload = () => {
      const dataUrlCandidate = r.result;
      const i = new Image();
      i.onload = () => {
        try {
          const isDoc = opts.isPrivate || opts.purpose === "doc" || opts.purpose === "receipt";
          const isAvatar = opts.purpose === "avatar";
          let maxDim = isAvatar ? 240 : (isDoc ? 620 : 480);
          if (opts.maxDim) maxDim = opts.maxDim;

          let w = i.width, h = i.height;
          const k = Math.min(1, maxDim / Math.max(w, h));
          const targetW = Math.max(1, Math.round(w * k));
          const targetH = Math.max(1, Math.round(h * k));

          const c = document.createElement("canvas");
          c.width = targetW;
          c.height = targetH;
          const ctx = c.getContext("2d");
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = "high";
          ctx.drawImage(i, 0, 0, targetW, targetH);

          const mime = supportsWebP ? "image/webp" : "image/jpeg";
          let q = isDoc ? 0.45 : 0.38;
          let dataUrl = c.toDataURL(mime, q);

          // إذا تجاوز الحجم 40 كيلوبايت في الصور العادية، نطبق ضغطاً ثانوياً
          if (dataUrl.length > 42000 && !isDoc) {
            const c2 = document.createElement("canvas");
            const k2 = Math.min(1, 380 / Math.max(targetW, targetH));
            c2.width = Math.max(1, Math.round(targetW * k2));
            c2.height = Math.max(1, Math.round(targetH * k2));
            const ctx2 = c2.getContext("2d");
            ctx2.imageSmoothingEnabled = true;
            ctx2.drawImage(c, 0, 0, c2.width, c2.height);
            dataUrl = c2.toDataURL(mime, 0.30);
          }

          const approxBytes = Math.round((dataUrl.length - 22) * 3 / 4);
          res({ dataUrl, origSize, newSize: approxBytes, mime, width: targetW, height: targetH });
        } catch (err) {
          res({ dataUrl: dataUrlCandidate, origSize, newSize: origSize, mime: file.type || "image/jpeg" });
        }
      };
      i.onerror = () => {
        res({ dataUrl: dataUrlCandidate, origSize, newSize: origSize, mime: file.type || "image/jpeg" });
      };
      i.src = dataUrlCandidate;
    };
    r.onerror = () => res({ dataUrl: "", origSize: 0, newSize: 0, mime: "" });
    r.readAsDataURL(file);
  });
}

/* رفع الصور مع ضغط فائق وضمان عدم فقدان الصورة وعرضها الفوري */
const img = async (f, isPrivate = false, purpose = "") => {
  if (!f) return "";
  let finalDataUrl = "";
  try {
    const comp = await compressImage(f, { isPrivate, purpose });
    finalDataUrl = comp.dataUrl;
    if (!finalDataUrl) return "";

    if (!LIVE || !st) return finalDataUrl;

    const ext = comp.mime === "image/webp" ? "webp" : "jpg";

    if (isPrivate) {
      const currentUid = uid || (au && au.currentUser && au.currentUser.uid);
      if (!currentUid) return finalDataUrl;
      const path = "private/" + currentUid + "/file_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6) + "." + ext;
      privUrlCache.set(path, finalDataUrl);
      try {
        const p = st.ref(path);
        const meta = { contentType: comp.mime };
        const uploadTask = p.putString(finalDataUrl, "data_url", meta).then(() => path);
        const timeoutPromise = new Promise(resolve => setTimeout(() => resolve(null), 4000));
        const res = await Promise.race([uploadTask, timeoutPromise]);
        return res || finalDataUrl;
      } catch (err) {
        console.warn("Private storage upload fallback:", err);
        return finalDataUrl;
      }
    } else {
      // صور المجتمع العامة (البلاغات، الخدمات، الأبطال، السوق، الفعاليات)
      try {
        const path = "img/" + Date.now() + "_" + Math.random().toString(36).slice(2, 6) + "." + ext;
        const p = st.ref(path);
        const meta = { contentType: comp.mime };
        privUrlCache.set(path, finalDataUrl);
        const uploadTask = p.putString(finalDataUrl, "data_url", meta).then(() => p.getDownloadURL());
        const timeoutPromise = new Promise(resolve => setTimeout(() => resolve(null), 4000));
        const remoteUrl = await Promise.race([uploadTask, timeoutPromise]);
        if (remoteUrl && typeof remoteUrl === "string" && remoteUrl.startsWith("http")) {
          return remoteUrl;
        }
        return finalDataUrl;
      } catch (err) {
        console.warn("Public storage upload notice, fallback to compressed dataUrl:", err);
        return finalDataUrl;
      }
    }
  } catch (e) {
    console.warn("img compression/upload error:", e);
    return finalDataUrl || "";
  }
};

function copyFirestoreRules() {
  const sample = `rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /{document=**} {
      allow read, write: if request.auth != null;
    }
  }
}`;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(sample).then(() => toast('تم نسخ القواعد! الصقها في تبويب Rules واضغط Publish'));
  } else {
    toast('انسخ محتوى ملف firestore.rules من مجلد التطبيق');
  }
}

/* ===== ترجمة أخطاء المصادقة ===== */
function translateError(x) {
  const code = x?.code || '';
  const msg = String(x?.message || '');
  if (code === 'auth/popup-closed-by-user') return 'تم إغلاق نافذة تسجيل الدخول قبل الإكمال.';
  if (code === 'auth/cancelled-popup-request') return '';
  if (code === 'auth/popup-blocked') return 'المتصفح حظر النافذة المنبثقة، يرجى السماح بالنوافذ المنبثقة لمتابعة تسجيل الدخول عبر Google.';
  if (code === 'auth/operation-not-allowed') return 'تسجيل الدخول عبر Google غير مفعّل في Firebase Console. يرجى تفعيله من Authentication > Sign-in method > Google.';
  if (code === 'auth/unauthorized-domain' || msg.includes('unauthorized-domain')) return 'هذا النطاق غير مصرح به في Firebase Auth. يرجى إضافته إلى Authorized domains في Firebase Console.';
  if (code === 'permission-denied' || msg.includes('insufficient permissions')) return 'تم رفض الإذن من Firestore. يرجى نشر قواعد firestore.rules في لوحة تحكم Firebase.';
  if (code === 'auth/email-already-in-use') return 'البريد الإلكتروني مسجل بالفعل لمستخدم آخر.';
  if (code === 'auth/weak-password') return 'كلمة المرور ضعيفة (يجب أن تكون 6 أحرف أو أكثر).';
  if (code === 'auth/user-not-found' || code === 'auth/wrong-password' || code === 'auth/invalid-credential') return 'البريد الإلكتروني أو كلمة المرور غير صحيحة.';
  if (code === 'auth/invalid-email') return 'صيغة البريد الإلكتروني غير صالحة.';
  if (code === 'auth/network-request-failed') return 'تعذر الاتصال بالخادم، تحقق من اتصال الإنترنت.';
  return msg || 'حدث خطأ، حاول مجددًا.';
}

async function handleGoogleAuthSuccess(gUser) {
  uid = gUser.uid;
  const isOwner = isSuperAdminEmail(gUser.email);

  // التحقق مما إذا كان للمستخدم مستند مسجل مسبقاً
  let userDoc = null;
  try {
    userDoc = await fs.collection('users').doc(gUser.uid).get();
  } catch (err) {
    console.warn('Could not read user doc from remote Firestore:', err);
  }

  if (!userDoc || !userDoc.exists) {
    completeProfileModal(gUser);
  } else {
    if (isOwner && userDoc.data()?.role !== 'admin') {
      try {
        await fs.collection('users').doc(gUser.uid).set({ role: 'admin', verify: 'approved' }, { merge: true });
      } catch (err) {
        console.warn('Role update notice:', err);
      }
    }
    toast('أهلاً بك مجددًا ' + (isOwner ? 'يا أدمن 🛡' : '👋'));
    R();
  }
}

/* تسجيل الدخول المباشر بحساب Google مع حماية من تكرار الضغط */
let isGoogleLoggingIn = false;
async function googleLogin(useRedirect = false) {
  if (isGoogleLoggingIn) return;
  if (LIVE) {
    isGoogleLoggingIn = true;
    const btns = document.querySelectorAll('.g-login-btn');
    btns.forEach(b => { b.disabled = true; b.style.opacity = '0.6'; b.style.pointerEvents = 'none'; });
    const provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });
    if (useRedirect) {
      try {
        await au.signInWithRedirect(provider);
        return;
      } catch (e) {
        console.error('Redirect sign in error:', e);
      } finally {
        isGoogleLoggingIn = false;
        btns.forEach(b => { b.disabled = false; b.style.opacity = '1'; b.style.pointerEvents = 'auto'; });
      }
    }
    try {
      const res = await au.signInWithPopup(provider);
      await handleGoogleAuthSuccess(res.user);
    } catch (e) {
      const errCode = e?.code || '';
      const errMsg = String(e?.message || '');
      console.warn('Google login notice:', errCode || errMsg);
      if (errCode === 'auth/unauthorized-domain' || errMsg.includes('unauthorized-domain')) {
        showUnauthorizedDomainModal();
        return;
      }
      if (errCode === 'auth/popup-blocked') {
        showPopupBlockedModal();
        return;
      }
      if (errCode === 'auth/popup-closed-by-user' || errCode === 'auth/cancelled-popup-request') {
        // المستخدم أغلق النافذة أو نقر مرة أخرى، لا حاجة لإظهار خطأ مزعج
        return;
      }
      toast(translateError(e));
    } finally {
      isGoogleLoggingIn = false;
      btns.forEach(b => { b.disabled = false; b.style.opacity = '1'; b.style.pointerEvents = 'auto'; });
    }
  } else {
    enterDemoMode();
  }
}

      } catch (e) { console.warn('users_private write warning:', e); }

      const userPayload = {
        name: v.name,
        email: v.email,
        photo: v.photo || '',
        photoURL: v.photo || '',
        gov: v.gov,
        job: (v.job || '').trim(),
        role: assignedRole,
        verify: assignedVerify,
        points: 0,
        banned: false,
        supporter: false,
        at: Date.now()
      };

      try {
        await fs.collection('users').doc(uid).set({
          ...userPayload,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      } catch (err) {
        console.warn('Remote write denied, saving locally:', err);
      }
      await DB.set('users', userPayload, uid);
      D.users = [{ ...userPayload, id: uid }, ...D.users.filter(x => x.id !== uid)];
    } else {
      if (D.users.some(u => u.email === v.email)) throw Error('البريد مستخدم من قبل');
      uid = 'u' + Date.now();
      LS.set('b_uid', uid);
      const userPayload = {
        name: v.name,
        email: v.email,
        photo: v.photo || '',
        photoURL: v.photo || '',
        gov: v.gov,
        job: (v.job || '').trim(),
        role: assignedRole,
        verify: assignedVerify,
        points: 0,
        banned: false,
        supporter: false,
        pw: v.pw,
        at: Date.now()
      };
      await DB.set('users', userPayload, uid);
      D.users = [{ ...userPayload, id: uid }, ...D.users.filter(x => x.id !== uid)];
    }
    toast('تم إنشاء الحساب بنجاح كـ مستخدم عادي 🎉');
    R();
  }, 'أنشئ الحساب', 'مرحباً بك في بلدتي! الحساب كمستخدم عادي ويمكن للأدمن ترقيتك.');
}

function addHero() {
  form('شارك مبادرتك', [['doer','اسم المنفذ أو المجموعة','text'],['body','ماذا فعلتم؟','area'],['photo','صورة','file']], v => DB.set('heroes', {
    by: uid, ...v, ok: false, likes: []
  }).then(() => toast('ستظهر بعد مراجعة الأدمن')), 'انشر');
}

const like = async id => {
  const h = D.heroes.find(x => x.id === id);
  if (!h) return;
  const l = h.likes || [];
  const has = l.includes(uid);
  if (LIVE) {
    try {
      await fs.collection('heroes').doc(id).update({
        likes: has ? firebase.firestore.FieldValue.arrayRemove(uid) : firebase.firestore.FieldValue.arrayUnion(uid)
      });
    } catch (e) {
      await DB.up('heroes', id, { likes: has ? l.filter(x => x !== uid) : [...l, uid] });
    }
  } else {
    await DB.up('heroes', id, { likes: has ? l.filter(x => x !== uid) : [...l, uid] });
  }
};

let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredInstallPrompt = e;
  const b = document.getElementById('pwa-btn-prompt');
  if (b) b.style.display = 'flex';
});

window.addEventListener('appinstalled', () => {
  deferredInstallPrompt = null;
  toast('مبارك! تم تثبيت تطبيق بلدتي على هاتفك بنجاح 📱🎉');
});

async function triggerPWAInstall() {
  if (deferredInstallPrompt) {
    deferredInstallPrompt.prompt();
    const { outcome } = await deferredInstallPrompt.userChoice;
    if (outcome === 'accepted') {
      toast('جارٍ تثبيت تطبيق بلدتي على هاتفك! 🎉');
      closeM();
    }
    deferredInstallPrompt = null;
  } else {
    toast('من قائمة المتصفح (⋮)، اضغط «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية».');
  }
}

function copyLink(url) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(url).then(() => toast('تم نسخ رابط التطبيق بنجاح! 📋'));
  } else {
    toast(url);
  }
}

/* ===== مستويات لوحة الشرف ===== */
const LV = [
  ['مواطن جديد', '🌱', 0],
  ['جار نشيط', '⭐', 10],
  ['حارس الحي', '🛡️', 50],
  ['بطل البلدة', '🏅', 150],
  ['أسطورة البلدة', '👑', 400]
];

let rankTab = 'ppl'; // 'ppl' أو 'ini'

function lvl(p) {
  p = +p || 0;
  let i = 0;
  LV.forEach((l, k) => {
    if (p >= l[2]) i = k;
  });
  return { c: LV[i], n: LV[i + 1] };
}

function fullLeaderboard() {

  R();

function rank() {
  const m = me() || { name: 'مواطن', points: 0, gov: 'القاهرة' };
  const userGov = m.gov || (GV !== 'all' ? GV : 'القاهرة');
  const scope = GV; // 'all' أو اسم المحافظة
  const sc = scope === 'all' ? 'كل مصر' : scope;

  // جلب كافة المستخدمين ودمج بيانات المستخدم الحالي الحية
  const allUsersMap = new Map();
  D.users.forEach(u => {
    if (u && u.id) allUsersMap.set(u.id, { ...u });
  });
  if (uid && m) {
    allUsersMap.set(uid, { ...(allUsersMap.get(uid) || {}), ...m });
  }

  const allMerged = Array.from(allUsersMap.values());
  // تصفية الأبطال الحقيقيين (نقاط > 0 وغير محظورين) حسب النطاق الجغرافي
  const all = allMerged
    .filter(u => (+u.points || 0) > 0 && !u.banned && (scope === 'all' || u.gov === scope))
    .sort((a, b) => (+b.points || 0) - (+a.points || 0));

  const myPts = +m.points || 0;
  const myRank = all.findIndex(u => u.id === uid) + 1;
  const L = lvl(myPts);
  const nx = L.n;

  const col = (u, r) => {
    if (!u) {
      return `
        <div class="pc r${r}">
          <div class="pa"><div class="hav" style="opacity:.3">؟</div></div>
          <span class="s">—</span>
          <div class="pb" style="opacity:.25">${r}</div>
        </div>
      `;
    }
    const pts = +u.points || 0;
    const isMe = u.id === uid;
    const avatarContent = u.photo || u.photoURL
      ? `<img src="${esc(u.photo || u.photoURL)}" class="hav" style="object-fit:cover" alt="">`
      : `<div class="hav">${esc((u.name || '?').trim()[0])}</div>`;

    return `
      <div class="pc r${r}">
        <div class="pa">
          ${r === 1 ? '<i class="cr">👑</i>' : ''}
          ${avatarContent}
        </div>
        <b class="pn" style="${isMe ? 'color:var(--ac);font-weight:700' : ''}">
          <span>${esc(u.name)}</span> ${vf(u)}
        </b>
        <span class="pp">${pts}</span>
        <div class="pb">${r}</div>
      </div>
    `;
  };

  const myAvatar = m.photo || m.photoURL
    ? `<img src="${esc(m.photo || m.photoURL)}" class="hav big" style="object-fit:cover" alt="">`
    : `<div class="hav big">${esc((m.name || '?').trim()[0])}</div>`;

  let h = `
    <div class="row" style="margin:4px 0 12px;align-items:center">
      <div class="brand" style="font-size:20px;font-weight:700;display:flex;align-items:center;gap:8px">
        🏆 لوحة الشرف
      </div>
      <div class="row" style="gap:8px">
        <button class="g" style="font-size:12.5px;padding:6px 12px" onclick="showPerksModal()">🎁 نظام المزايا</button>
        ${m && m.role==='admin'?`<button class="g" style="font-size:12px;padding:6px 12px;color:var(--rd);border-color:var(--rd);font-weight:700" onclick="confirmResetDatabaseForProduction()" title="خاص بحساب الأدمن فقط - لا يظهر للعامة">🛡️ تنظيف بيانات الاختبار (خاص بالأدمن فقط)</button>`:''}
      </div>
    </div>

    <p class="s" style="margin:2px 0 12px">أبطال البلدة في ${esc(sc)} · تكريم لمن يخدم بلده ويصنع أثراً حقيقياً</p>

    <div class="chips">
      <button class="${scope !== 'all' ? '' : 'g'}" onclick="GV='${esc(userGov)}';R()">📍 ${esc(userGov)}</button>
      <button class="${scope === 'all' ? '' : 'g'}" onclick="GV='all';R()">🇪🇬 كل مصر</button>
      <button class="${rankTab === 'ppl' ? '' : 'g'}" onclick="rankTab='ppl';R()">الأبطال</button>
      <button class="${rankTab === 'ini' ? '' : 'g'}" onclick="rankTab='ini';R()">أفضل المبادرات</button>
    </div>

    <div class="hb">
      <div class="row" style="flex-wrap:nowrap">
        ${myAvatar}
        <div style="flex:1;min-width:0;margin-right:12px">
          <b style="font-size:17px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(m.name)} ${vf(m)}</b>
          <div style="opacity:.85;font-size:13px">${L.c[1]} ${L.c[0]}</div>
        </div>
        <div style="text-align:center;flex:none">
          <div style="font-size:26px;font-weight:700;line-height:1.2">${myRank ? '#' + myRank : '—'}</div>

        ${myPts} نقطة${nx ? ` · باقي ${Math.max(0, nx[2] - myPts)} للوصول إلى ${nx[1]} ${nx[0]}` : ' · أعلى مستوى 👑'}
      </p>
    </div>
  `;

  if (rankTab === 'ppl') {
    h += all.length ? `
      <div class="pod">
        ${col(all[1], 2)}
        ${col(all[0], 1)}
        ${col(all[2], 3)}
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px">
        ${all.slice(3, 25).map((u, i) => {
          const isMe = u.id === uid;
          const uPts = +u.points || 0;
          const uLvl = lvl(uPts);
          const userPic = u.photo || u.photoURL
            ? `<img src="${esc(u.photo || u.photoURL)}" class="hav" style="object-fit:cover" alt="">`
            : `<div class="hav">${esc((u.name || '?').trim()[0])}</div>`;

          return `
            <div class="card hr ${isMe ? 'me' : ''}" style="margin-bottom:0">

const join = async id => {
  const ev = D.events.find(x => x.id === id);
  if (!ev) return;
  const g = ev.going || [];
  const has = g.includes(uid);
  if (LIVE) {
    try {
      await fs.collection('events').doc(id).update({
        going: has ? firebase.firestore.FieldValue.arrayRemove(uid) : firebase.firestore.FieldValue.arrayUnion(uid)
      });
    } catch (e) {
      await DB.up('events', id, { going: has ? g.filter(x => x !== uid) : [...g, uid] });
    }
  } else {
    await DB.up('events', id, { going: has ? g.filter(x => x !== uid) : [...g, uid] });
  }
};

/* قبول الدفعة عبر writeBatch لضمان الذرية */
const payOk = async id => {
  const p = D.payments.find(x => x.id === id);
  if (!p) return;
  if (LIVE) {
    try {
      const batch = fs.batch();
      batch.update(fs.collection('payments').doc(id), { status: 'approved' });
      if (p.sid) {
        const sv = D.services.find(x => x.id === p.sid);
        const curUntil = (sv && isP(sv) && sv.until) ? sv.until : Date.now();
        const newUntil = Math.max(Date.now(), curUntil) + (p.days || 0) * 864e5;
        batch.update(fs.collection('services').doc(p.sid), { premium: true, until: newUntil });
      }
      if (p.kind === 'support') {
        const supUser = usr(p.by);
        const curPts = +supUser?.points || 0;
        const newPts = curPts + 30;
        if (supUser) { supUser.supporter = true; supUser.points = newPts; }
        batch.update(fs.collection('users').doc(p.by), { supporter: true, points: newPts });
      }
      if (p.kind === 'fine' && p.fid) {
        batch.update(fs.collection('fines').doc(p.fid), { status: 'paid' });
      }
      await batch.commit();
    } catch (e) {
      console.warn('Batch payOk fallback:', e);
      const sv = D.services.find(x => x.id === p.sid);
      if (sv) DB.up('services', p.sid, { premium: true, until: Math.max(Date.now(), isP(sv) && sv.until ? sv.until : 0) + (p.days || 0) * 864e5 });
      DB.up('payments', id, { status: 'approved' });
      if (p.kind === 'support') {
        const supUser = usr(p.by);
        const curPts = +supUser?.points || 0;
        const newPts = curPts + 30;
        if (supUser) { supUser.supporter = true; supUser.points = newPts; }
        DB.up('users', p.by, { supporter: true, points: newPts });
      }
      if (p.kind === 'fine' && p.fid) DB.up('fines', p.fid, { status: 'paid' });
    }
  } else {
    const sv = D.services.find(x => x.id === p.sid);
    if (sv) DB.up('services', p.sid, { premium: true, until: Math.max(Date.now(), isP(sv) && sv.until ? sv.until : 0) + (p.days || 0) * 864e5 });
    DB.up('payments', id, { status: 'approved' });
    if (p.kind === 'support') {
      const supUser = usr(p.by);
      const curPts = +supUser?.points || 0;
      const newPts = curPts + 30;
      if (supUser) { supUser.supporter = true; supUser.points = newPts; }
      DB.up('users', p.by, { supporter: true, points: newPts });
    }
    if (p.kind === 'fine') DB.up('fines', p.fid, { status: 'paid' });
  }
  toast(p.kind === 'support' ? 'قُبل الدعم ومُنح +30 نقطة شرف! 💙' : p.kind === 'fine' ? 'سُددت الغرامة' : 'فُعّل التمييز');
};

const executeFineIt = async (c, id) => {
  const x = (D[c] || []).find(y => y.id === id);
  if (!x) return;
  // تحرير مساحة التخزين من أي صور مرتبطة
  ['photo', 'after', 'img', 'doc', 'receipt'].forEach(k => {
    if (x[k]) deleteStorageFile(x[k]);
  });
  const fData = {
    uid: x.by || x.uid,
    amount: FINE,
    reason: 'محتوى غير صحيح: ' + String(x.desc || x.title || x.body || x.doer || '').slice(0, 60),
    status: 'due',
    at: Date.now(),
    ack: Date.now(),
    fine: FINE
  };
  if (LIVE) {
    try {
      const batch = fs.batch();
      const fineRef = fs.collection('fines').doc();
      batch.set(fineRef, { ...fData, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
      batch.delete(fs.collection(c).doc(id));
      await batch.commit();
      D[c] = (D[c] || []).filter(y => y.id !== id);
      L.s(c, L.g(c).filter(y => y.id !== id));
      fire(c);
    } catch (e) {
      console.warn('Batch fineIt fallback:', e);
      await DB.set('fines', fData);
      await DB.del(c, id);
    }
  } else {
    await DB.set('fines', fData);
    await DB.del(c, id);
  }
  toast('سُجّلت الغرامة وحُذف المحتوى وتحررت المساحة 🗑️');
  R();
};

async function executeSetUserRole(userId, newRole) {
  const target = D.users.find(x => x.id === userId);
  if (!target) return;
  const isNowAdmin = newRole === 'admin';
  const roleName = RL[newRole] || newRole;
  try {
    const patch = { role: newRole };
    if (isNowAdmin) patch.verify = 'approved';

async function executeResetDatabaseForProduction() {
  const m = me();
  if (!m || m.role !== 'admin') {
    toast('هذا الإجراء متاح فقط للأدمن 🛡️');
    return;
  }
  toast('جارٍ تنظيف كافة البيانات التجريبية من قاعدة البيانات… ⏳');
  try {
    const purgeCols = ['services','issues','heroes','charity','market','events','jobs','notes','reports','payments','fines','reviews'];
    
    // 1. حذف كافة المستندات التجريبية في كل المجموعات
    for (const c of purgeCols) {
      if (LIVE) {
        try {
          const snap = await fs.collection(c).get();
          const batchPromises = snap.docs.map(doc => fs.collection(c).doc(doc.id).delete());
          await Promise.all(batchPromises);
        } catch (e) {
          console.warn('Error purging Firestore collection ' + c, e);
        }
      }
      D[c] = [];
      L.s(c, []);
    }

    // 2. تنظيف الحسابات في مجموعة users ومجموعة users_private باستثناء حساب الأدمن الحالي
    if (LIVE) {
      try {
        const uSnap = await fs.collection('users').get();
        for (const doc of uSnap.docs) {
          if (doc.id !== uid) {
            await fs.collection('users').doc(doc.id).delete().catch(() => {});
            try { await fs.collection('users_private').doc(doc.id).delete(); } catch(e){}
          }
        }
      } catch (e) {
        console.warn('Error purging test users:', e);
      }

      // تصفير نقاط حساب الأدمن الحالي في السيرفر
      if (uid) {
        try {
          await fs.collection('users').doc(uid).update({
            points: 0,
            supporter: false,
            role: 'admin',
            verify: 'approved'
          });
        } catch (e) {
          console.warn('Error resetting admin points:', e);
        }
      }
    }

    // 3. تحديث مصفوفة المستخدمين بالذاكرة للإبقاء فقط على حساب الأدمن الحالي بنقاط 0
    const myDoc = me();
    if (myDoc && uid) {
      myDoc.points = 0;
      myDoc.supporter = false;
      D.users = [{
        ...myDoc,
        id: uid,
        role: 'admin',
        verify: 'approved',
        points: 0,
        supporter: false
      }];
    } else {
      D.users = [];
    }
    L.s('users', D.users);

    // 4. مسح بيانات التخزين المؤقت المحلي المرتبطة بالاختبارات
    try {
      const keys = Object.keys(localStorage);
      keys.forEach(k => {
        if (k.startsWith('b_') && k !== 'b_users' && k !== 'baldaty_custom_logo') {
          localStorage.removeItem(k);
        }
      });
    } catch (e) {}

    toast('تم تنظيف قاعدة البيانات بالكامل وتصفير النقاط! المنصة جاهزة للتشغيل الفعلي 🚀');
    R();
  } catch (err) {
    console.error('Error during database purge:', err);
    toast('تم تنظيف البيانات بنجاح وجارٍ التحديث');
    R();
  }
}

function APP_LOGO() {
  const fromCfg = D.cfg?.find(x => x.id === 'branding')?.logo;

}

async function uploadBrandLogo(e) {
  const file = e.target && e.target.files && e.target.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')) return toast('يرجى اختيار ملف صورة صالح (PNG, JPG, SVG, WebP)');
  try {
    const comp = await compressImage(file, { maxDim: 480, purpose: 'logo' });
    const dataUrl = comp.dataUrl;
    LS.set('baldaty_custom_logo', dataUrl);
    try {
      await fetch('/api/upload-logo', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ imageBase64: dataUrl })
      });
    } catch (err) {
      console.warn('Backend disk save skipped:', err);
    }
    if (LIVE) {
      try {
        await DB.set('cfg', { logo: dataUrl, updatedAt: Date.now() }, 'branding');
      } catch (err) {
        console.warn('Firestore branding save error:', err);
      }
    }
    toast('تم اعتماد وتحديث الشعار بنجاح');
    R();
  } catch (err) {
    console.error('Logo upload compression error:', err);
    toast('تعذر معالجة ملف الشعار');
  }
}

async function purgeStorageCache() {
  privUrlCache.clear();
  try {
    const keys = Object.keys(localStorage);
    let count = 0;
    keys.forEach(k => {
      if (k.startsWith('b_') && !['b_users', 'b_cfg'].includes(k)) {
        try {
          const val = JSON.parse(localStorage.getItem(k) || '[]');
          if (Array.isArray(val) && val.length > 35) {
            localStorage.setItem(k, JSON.stringify(val.slice(0, 35)));
            count++;
          }
        } catch(e) {}
      }
    });
    toast('تم تحسين الذاكرة بنجاح! تم تنظيف وتوفير مساحة الكاش 🧹');
  } catch (err) {
    toast('تم تنظيف الكاش بنجاح');
  }
  R();
}

async function testImageCompression(e) {
  const file = e.target && e.target.files && e.target.files[0];
  if (!file) return;
  try {
    toast('⚡ جاري اختبار الضغط الفائق...');
    const res = await compressImage(file, { purpose: 'test' });
    const origKB = Math.round(res.origSize / 1024);
    const newKB = Math.max(1, Math.round(res.newSize / 1024));
    const savedPct = Math.round((1 - res.newSize / res.origSize) * 100);
    sheet(`
      <h2>نتيجة اختبار الضغط الفائق ⚡</h2>
      <p class="s">معاينة حية تبين التوفير الضخم في المساحة لهذه الصورة:</p>
      <div style="text-align:center;margin:14px 0">
        <img src="${res.dataUrl}" style="max-width:180px;max-height:180px;border-radius:14px;box-shadow:var(--sh);border:1px solid var(--ln)" alt="معاينة">
      </div>
      <div class="grid" style="margin-bottom:14px">
        <div class="st"><b>${origKB} KB</b>الحجم الأصلي</div>
        <div class="st"><b>${newKB} KB</b>الحجم بعد الضغط</div>
        <div class="st" style="border-color:#10b981"><b style="color:#059669">${savedPct}%</b>نسبة التوفير</div>
      </div>
      <p style="font-size:13px;line-height:1.6">تم التحويل لصيغة: <b>${res.mime}</b> · الأبعاد الناتجة: <b>${res.width}×${res.height}</b> بكسل.<br>بهذا الضغط، حتى مئات الصور تستهلك بضعة ميجابايتات قليلة فقط ولا تنفد باقة Firebase أبداً!</p>
    `);
  } catch (err) {
    toast('تعذر إتمام اختبار الصورة');
  }
}
